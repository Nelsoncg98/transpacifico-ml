services:
  - type: web
    name: transpacifico
    runtime: python
    plan: free
    region: ohio
    branch: main
    autoDeployTrigger: "off"
    buildCommand: pip install -r sistema/requirements.txt && python -m sistema.entrenar
    startCommand: uvicorn sistema.app:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /salud
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: DATABASE_URL
        sync: false
      - key: APP_USER
        value: operador@transpacifico.pe
      - key: APP_PASSWORD
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: MPLBACKEND
        value: Agg
      - key: OMP_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
