{% if puede(usuario,'entregas') %}
{% if viaje.estado_viaje=='En tránsito' %}
<form method="post" action="/viajes/{{ viaje.id_despacho }}/llegar" class="tarjeta">
  {{ campo_csrf() }}<button type="submit">Registrar llegada al destino</button>
</form>
{% endif %}
{% if viaje.estado_viaje=='En destino' %}
<details class="tarjeta" open><summary>Registrar entrega y cerrar viaje</summary>
  <form method="post" action="/viajes/{{ viaje.id_despacho }}/entregar" class="formulario rejilla">
    {{ campo_csrf() }}
    <label>Fecha y hora real de entrega (Perú)
      <input name="fecha" type="datetime-local" value="{{ ahora }}" required>
    </label>
    <label>Nombre del receptor<input name="receptor" maxlength="100" required></label>
    <label>DNI del receptor<input name="dni" pattern="[0-9]{8}" maxlength="8" required></label>
    <label>Enlace de la constancia (POD)<input name="foto" type="url" maxlength="255" required></label>
    <label>Odómetro final (km)
      <input name="odometro" type="number" min="{{ viaje.odometro_inicial_km }}" required>
    </label>
    <label class="casilla"><input name="precintos_conformes" type="checkbox" value="true">
      Precintos conformes</label>
    <label class="casilla"><input name="carga_completa" type="checkbox" value="true">
      Carga entregada completa</label>
    <button type="submit">Guardar entrega y cerrar</button>
  </form>
</details>
{% endif %}
<details class="tarjeta"><summary>Registrar incidencia</summary>
  <form method="post" action="/viajes/{{ viaje.id_despacho }}/incidencia" class="formulario rejilla">
    {{ campo_csrf() }}
    <label>Tipo<input name="tipo" maxlength="50" required></label>
    <label>Descripción<input name="descripcion" maxlength="255" required></label>
    <label>Acción tomada<input name="accion" maxlength="255"></label>
    <button type="submit">Guardar incidencia</button>
  </form>
</details>
{% endif %}
